<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#090b12" />
  <title>GUNSHADE // CO-OP</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div class="hud top-left">
    <div class="brand">GUNSHADE <span>// CO-OP</span></div>
    <div class="player-hud"><div class="hp"><i id="hpFill"></i><b id="hpText">100 / 100 HP</b></div><div class="player-tag" id="playerTag">ПОДКЛЮЧЕНИЕ…</div></div>
    <div class="weapon-card"><strong id="weaponText">ПИСТОЛЕТ</strong><span id="ammoText">ПАТРОНЫ 6 / 6</span></div>
  </div>
  <div class="hud top-right"><div class="connection" id="connection">● ПОДКЛЮЧЕНИЕ</div><div class="coop-card"><span class="dot blue"></span><b>ИГРОК 1</b><em id="p1Status">—</em><span class="dot purple"></span><b>ИГРОК 2</b><em id="p2Status">—</em></div></div>
  <div class="center-message" id="centerMessage"><strong>ИЩЕМ ВТОРОГО ИГРОКА</strong><span>Открой страницу на втором устройстве</span></div>
  <div class="controls desktop-controls"><span><kbd>WASD</kbd> движение</span><span><kbd>МЫШЬ</kbd> прицел</span><span><kbd>ЛКМ</kbd> огонь</span><span><kbd>Q</kbd> смена оружия</span><span><kbd>E</kbd> подобрать</span></div>
  <div class="mobile-controls">
    <div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
    <div class="mobile-actions"><button id="interactBtn">E<br><small>взять</small></button><button id="swapBtn">Q<br><small>смена</small></button><button class="fire" id="fireBtn">FIRE</button></div>
  </div>
  <div class="death-modal" id="deathModal"><div class="death-card"><small>СВЯЗЬ ПРЕРВАНА</small><h1>ОТРЯД ПАЛ</h1><p>Оба игрока уничтожены. Вернуться в бой?</p><button id="restartBtn">ИГРАТЬ СНОВА</button></div></div>
  <script src="/app.js" defer></script>
</body>
</html>
